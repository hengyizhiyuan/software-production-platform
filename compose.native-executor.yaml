services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: spg_dev
      POSTGRES_USER: spg
      POSTGRES_PASSWORD: spg-native-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [control]
    volumes:
      - native-postgres-data:/var/lib/postgresql/data

  app:
    image: ${SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_IMAGE:-watt-native-executor-runtime:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: native-verification
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPG_APPLICATION_NAME: Watt Native Executor Acceptance
      SPG_DATABASE_URL: postgresql+psycopg://spg:spg-native-local@postgres:5432/spg_dev?sslmode=disable&connect_timeout=5
      SPG_REPOSITORY_PATH: /var/lib/spg/repository
      SPG_RUNTIME_PROFILE: watt-native-executor-acceptance
      SPG_OPERATOR_TOKEN: ${SPG_OPERATOR_TOKEN:?Set a dedicated Watt operator token of at least 32 characters}
      SPG_WORKSPACE_ROOT: /var/lib/spg/native-workspaces
      SPG_EXECUTOR_ADAPTER: watt-native
      SPG_VERIFICATION_ADAPTER: contract-driven-repository
      SPG_NATIVE_EXECUTOR_ENABLED: "true"
      SPG_NATIVE_EXECUTOR_BACKEND: watt-native
      SPG_NATIVE_EXECUTOR_WORKER_PROFILE: local-container-v1
      SPG_NATIVE_EXECUTOR_RESOURCE_PROFILE: standard
      SPG_NATIVE_EXECUTOR_STORAGE_ROOT: /var/lib/spg/native-git-checkpoints
      SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_STORE_ROOT: /var/lib/spg/production-environments
      SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_IMAGE: ${SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_IMAGE:-watt-native-executor-runtime:local}
      SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_WORKSPACE_VOLUME: ${SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_WORKSPACE_VOLUME:-watt-native-workspaces}
      SPG_NATIVE_EXECUTOR_INFERENCE_PROVIDER: ${SPG_NATIVE_EXECUTOR_INFERENCE_PROVIDER:-deepseek}
      SPG_NATIVE_EXECUTOR_INFERENCE_MODEL: ${SPG_NATIVE_EXECUTOR_INFERENCE_MODEL:-deepseek-flash}
      SPG_NATIVE_EXECUTOR_INFERENCE_REASONING_EFFORT: ${SPG_NATIVE_EXECUTOR_INFERENCE_REASONING_EFFORT:-high}
      SPG_DEEPSEEK_API_KEY: ${SPG_DEEPSEEK_API_KEY:-}
      SPG_GITHUB_READ_TOKEN: ${SPG_GITHUB_READ_TOKEN:-}
      SPG_GITHUB_WRITE_TOKEN: ${SPG_GITHUB_WRITE_TOKEN:-}
      SPG_WEB_SEARCH_API_KEY: ${SPG_WEB_SEARCH_API_KEY:-}
      SPG_DEEPSEEK_BASE_URL: ${SPG_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SPG_WIC_PROVIDER_ADAPTER: ${SPG_WIC_PROVIDER_ADAPTER:-deepseek}
      SPG_WIC_PROVIDER_MODEL: ${SPG_WIC_PROVIDER_MODEL:-deepseek-flash}
      SPG_WIC_PROVIDER_REASONING_EFFORT: ${SPG_WIC_PROVIDER_REASONING_EFFORT:-low}
      SPG_CONVERSATION_PROVIDER_ADAPTER: ${SPG_CONVERSATION_PROVIDER_ADAPTER:-deepseek}
      SPG_CONVERSATION_PROVIDER_MODEL: ${SPG_CONVERSATION_PROVIDER_MODEL:-deepseek-flash}
      SPG_CONVERSATION_PROVIDER_REASONING_EFFORT: ${SPG_CONVERSATION_PROVIDER_REASONING_EFFORT:-low}
    init: true
    ports:
      - "127.0.0.1:${SPG_NATIVE_APP_PORT:-8040}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 3s
      timeout: 4s
      retries: 30
      start_period: 15s
    networks: [control]
    group_add: ["${DOCKER_GID:-0}"]
    volumes:
      - type: bind
        source: ./.git
        target: /source/.git
        read_only: true
      - native-app-data:/var/lib/spg
      - native-workspaces:/var/lib/spg/native-workspaces
      - /var/run/docker.sock:/var/run/docker.sock

  native-coordinator:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "spg.executor_coordinator"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      SPG_DATABASE_URL: postgresql+psycopg://spg:spg-native-local@postgres:5432/spg_dev?sslmode=disable&connect_timeout=5
      SPG_NATIVE_EXECUTOR_ENABLED: "true"
      SPG_NATIVE_EXECUTOR_POLL_SECONDS: "1"
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [control]

  native-tool-host:
    build:
      context: .
      dockerfile: Dockerfile
      target: native-tool-host
    command: ["uvicorn", "spg.tool_host_api:create_tool_host_application", "--factory", "--host", "0.0.0.0", "--port", "8011"]
    environment:
      SPG_NATIVE_EXECUTOR_WORKSPACE_ROOT: /var/lib/spg/native-workspaces
      SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN: ${SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN:?Set a dedicated native Tool Host token}
      SPG_NATIVE_EXECUTOR_CONTAINER_ISOLATION_REQUIRED: "true"
      SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_WORKSPACE_VOLUME: ${SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_WORKSPACE_VOLUME:-watt-native-workspaces}
      SPG_NATIVE_EXECUTOR_RECEIPT_SPOOL_ROOT: /var/lib/spg/native-tool-receipts
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3).read()"]
      interval: 3s
      timeout: 4s
      retries: 20
    networks: [executor]
    group_add: ["${DOCKER_GID:-0}"]
    volumes:
      - native-app-data:/var/lib/spg:ro
      - native-workspaces:/var/lib/spg/native-workspaces
      - native-tool-receipts:/var/lib/spg/native-tool-receipts
      - /var/run/docker.sock:/var/run/docker.sock

  native-worker:
    profiles: [provider]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "spg.executor_worker"]
    depends_on:
      app:
        condition: service_healthy
      native-tool-host:
        condition: service_healthy
    environment:
      SPG_DATABASE_URL: postgresql+psycopg://spg:spg-native-local@postgres:5432/spg_dev?sslmode=disable&connect_timeout=5
      SPG_NATIVE_EXECUTOR_ENABLED: "true"
      SPG_NATIVE_EXECUTOR_WORKER_ID: native-worker-acceptance-1
      SPG_NATIVE_EXECUTOR_WORKER_PROFILE: local-container-v1
      SPG_NATIVE_EXECUTOR_RESOURCE_PROFILE: standard
      SPG_NATIVE_EXECUTOR_STORAGE_ROOT: /var/lib/spg/native-checkpoints
      SPG_NATIVE_EXECUTOR_WORKSPACE_ROOT: /var/lib/spg/native-workspaces
      SPG_NATIVE_EXECUTOR_TOOL_HOST_URL: http://native-tool-host:8011
      SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN: ${SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN:?Set a dedicated native Tool Host token}
      SPG_NATIVE_EXECUTOR_INFERENCE_PROVIDER: ${SPG_NATIVE_EXECUTOR_INFERENCE_PROVIDER:-deepseek}
      SPG_NATIVE_EXECUTOR_INFERENCE_MODEL: ${SPG_NATIVE_EXECUTOR_INFERENCE_MODEL:-deepseek-flash}
      SPG_NATIVE_EXECUTOR_INFERENCE_REASONING_EFFORT: ${SPG_NATIVE_EXECUTOR_INFERENCE_REASONING_EFFORT:-high}
      SPG_DEEPSEEK_BASE_URL: ${SPG_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SPG_DEEPSEEK_API_KEY: ${SPG_DEEPSEEK_API_KEY:?Set an admitted DeepSeek API key}
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [control, executor]
    volumes:
      - native-workspaces:/var/lib/spg/native-workspaces
      - native-checkpoints:/var/lib/spg/native-checkpoints

networks:
  control:
  executor:
    internal: true

volumes:
  native-postgres-data:
  native-app-data:
  native-workspaces:
    name: ${SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_WORKSPACE_VOLUME:-watt-native-workspaces}
  native-checkpoints:
  native-tool-receipts:
