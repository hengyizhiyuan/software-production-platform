<!doctype html>
<html lang="zh-CN">
<head>

  <title>Watt · 产品工作区</title>
  <link rel="stylesheet" href="/assets/experience.css?v=1">

  <a class="skip-link" href="#content">跳到正文</a>
  <div class="site-shell">

      <nav class="primary-nav" aria-label="主导航">
        <a href="/" data-route data-nav="home">首页</a>

  <div id="dialog-layer" class="dialog-layer" hidden>

    <section id="dialog-content" class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></section>
  </div>
