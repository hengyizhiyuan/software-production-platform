# Compose with compose.native-executor.yaml and the provider profile.
# Delivery is served by the same governed Native Executor runtime.
services:
  app:
    environment:
      SPG_DELIVERY_RUNTIME_ENABLED: "true"
      SPG_DELIVERY_RUNTIME_BIND_HOST: "0.0.0.0"
      SPG_RUNTIME_PROFILE: work-to-delivery-acceptance
    ports:
      - "127.0.0.1:8010-8019:8010-8019"
