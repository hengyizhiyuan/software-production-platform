name: watt-cloud-worker

x-runtime-image: &runtime-image
  image: watt-cloud-worker:local

x-database-url: &database-url
  SPG_DATABASE_URL: postgresql+psycopg://spg:${SPG_POSTGRES_PASSWORD:?Set SPG_POSTGRES_PASSWORD}@postgres:5432/spg_dev?sslmode=disable&connect_timeout=5

x-runtime-state: &runtime-state
  SPG_RUNTIME_PROFILE: cloud-worker-single-ecs-v1
  SPG_WORKSPACE_ROOT: /var/lib/spg/native-workspaces
  SPG_OWNER_RUNTIME_STORE_ROOT: /var/lib/spg/owner-runtime
  SPG_NATIVE_EXECUTOR_STORAGE_ROOT: /var/lib/spg/native-executor
  SPG_NATIVE_EXECUTOR_WORKSPACE_ROOT: /var/lib/spg/native-workspaces
  SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_STORE_ROOT: /var/lib/spg/production-environments
  SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_IMAGE: watt-cloud-worker:local
  SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_WORKSPACE_VOLUME: watt-native-workspaces

x-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  gitea:
    image: docker.gitea.com/gitea:1.27.3-rootless
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - watt-gitea-data:/var/lib/gitea
      - watt-gitea-config:/etc/gitea
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *bounded-logging
    networks: [control]

  postgres:
    image: public.ecr.aws/docker/library/postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spg_dev
      POSTGRES_USER: spg
      POSTGRES_PASSWORD: ${SPG_POSTGRES_PASSWORD:?Set SPG_POSTGRES_PASSWORD}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spg -d spg_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *bounded-logging
    networks: [control]

  migrate:
    <<: *runtime-image
    build:
      context: ./source
      dockerfile: deploy/cloud-worker/Dockerfile
      target: runtime
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-url
    logging: *bounded-logging
    networks: [control]

  api:
    <<: *runtime-image
    command: ["python", "-m", "uvicorn", "spg.api.http:create_http_application", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      gitea:
        condition: service_healthy
      native-tool-host:
        condition: service_healthy
    environment:
      <<: [*database-url, *runtime-state]
      SPG_APPLICATION_NAME: Watt Cloud Worker Runtime
      SPG_OPERATOR_TOKEN: ${SPG_OPERATOR_TOKEN:?Set SPG_OPERATOR_TOKEN}
      SPG_DEEPSEEK_API_KEY: ${SPG_DEEPSEEK_API_KEY:?Set SPG_DEEPSEEK_API_KEY}
      SPG_EXECUTOR_ADAPTER: watt-native
      SPG_NATIVE_EXECUTOR_ENABLED: "true"
      SPG_NATIVE_EXECUTOR_INFERENCE_PROVIDER: deepseek
      SPG_NATIVE_EXECUTOR_INFERENCE_MODEL: ${SPG_NATIVE_EXECUTOR_INFERENCE_MODEL:-deepseek-flash}
      SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN: ${SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN:?Set SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN}
      SPG_NATIVE_EXECUTOR_TOOL_HOST_URL: http://native-tool-host:8011
      SPG_WIC_RUNTIME_MODE: WIC_VNEXT_CONTROLLED
      SPG_WIC_PROVIDER_ADAPTER: deepseek
      SPG_CONVERSATION_PROVIDER_ADAPTER: deepseek
      SPG_OWNER_RUNTIME_MODE: REQUIRED
      SPG_MANAGED_SOURCE_PROVIDER: gitea
      SPG_MANAGED_SOURCE_ENDPOINT: http://gitea:3000
      SPG_MANAGED_SOURCE_PUBLIC_ENDPOINT: http://gitea:3000
      SPG_MANAGED_SOURCE_USERNAME: watt-managed
      SPG_MANAGED_SOURCE_PASSWORD: ${WATT_GITEA_PASSWORD:?Set dedicated managed-source credential}
      SPG_MANAGED_SOURCE_NAMESPACE: watt-managed
      SPG_MANAGED_SOURCE_WORKSPACE_ROOT: /var/lib/spg/managed-source
      PYTHONPATH: /opt/watt-owners/ecf/src:/opt/watt-owners/guardian/src:/app/src
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s
    volumes:
      - /data/watt/app:/var/lib/spg
      - /data/watt/native-executor:/var/lib/spg/native-executor
      - /data/watt/owners/ecf:/opt/watt-owners/ecf:ro
      - /data/watt/owners/guardian:/opt/watt-owners/guardian:ro
      - watt-native-workspaces:/var/lib/spg/native-workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:?Set DOCKER_GID}"]
    logging: *bounded-logging
    networks: [control, executor]

  native-coordinator:
    <<: *runtime-image
    command: ["python", "-m", "spg.executor_coordinator"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *database-url
      SPG_NATIVE_EXECUTOR_ENABLED: "true"
      SPG_NATIVE_EXECUTOR_POLL_SECONDS: "1"
      SPG_NATIVE_EXECUTOR_STORAGE_ROOT: /var/lib/spg/native-executor
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /data/watt/native-executor:/var/lib/spg/native-executor
      - watt-native-workspaces:/var/lib/spg/native-workspaces
    logging: *bounded-logging
    networks: [control]

  native-tool-host:
    <<: *runtime-image
    command: ["python", "-m", "uvicorn", "spg.tool_host_api:create_tool_host_application", "--factory", "--host", "0.0.0.0", "--port", "8011"]
    restart: unless-stopped
    environment:
      SPG_NATIVE_EXECUTOR_WORKSPACE_ROOT: /var/lib/spg/native-workspaces
      SPG_NATIVE_EXECUTOR_RECEIPT_SPOOL_ROOT: /var/lib/spg/native-tool-receipts
      SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN: ${SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN:?Set SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN}
      SPG_NATIVE_EXECUTOR_CONTAINER_ISOLATION_REQUIRED: "true"
      SPG_NATIVE_EXECUTOR_TOOL_HOST_ISOLATION: production-environment-only
      SPG_NATIVE_EXECUTOR_PRODUCTION_ENVIRONMENT_WORKSPACE_VOLUME: watt-native-workspaces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    group_add: ["${DOCKER_GID:?Set DOCKER_GID}"]
    volumes:
      - /data/watt/app:/var/lib/spg:ro
      - watt-native-workspaces:/var/lib/spg/native-workspaces
      - /data/watt/tool-receipts:/var/lib/spg/native-tool-receipts
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *bounded-logging
    networks: [executor]

  native-worker:
    <<: *runtime-image
    command: ["python", "-m", "spg.executor_worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      native-tool-host:
        condition: service_healthy
    environment:
      <<: [*database-url, *runtime-state]
      SPG_NATIVE_EXECUTOR_ENABLED: "true"
      SPG_NATIVE_EXECUTOR_WORKER_ID: cloud-worker-1
      SPG_NATIVE_EXECUTOR_WORKER_PROFILE: local-container-v1
      SPG_NATIVE_EXECUTOR_RESOURCE_PROFILE: standard
      SPG_NATIVE_EXECUTOR_TOOL_HOST_URL: http://native-tool-host:8011
      SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN: ${SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN:?Set SPG_NATIVE_EXECUTOR_INTERNAL_TOKEN}
      SPG_NATIVE_EXECUTOR_INFERENCE_PROVIDER: deepseek
      SPG_NATIVE_EXECUTOR_INFERENCE_MODEL: ${SPG_NATIVE_EXECUTOR_INFERENCE_MODEL:-deepseek-flash}
      SPG_DEEPSEEK_API_KEY: ${SPG_DEEPSEEK_API_KEY:?Set SPG_DEEPSEEK_API_KEY}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - watt-native-workspaces:/var/lib/spg/native-workspaces
      - /data/watt/native-executor:/var/lib/spg/native-executor
    logging: *bounded-logging
    networks: [control, executor]

networks:
  control:
  executor:
    internal: true

volumes:
  watt-gitea-data:
  watt-gitea-config:
  watt-native-workspaces:
    name: watt-native-workspaces
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/watt/workspaces
