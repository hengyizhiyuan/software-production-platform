[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spg-runtime"
version = "0.1.0"
description = "Software Production Governor runtime foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1,<2",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
codex-executor = [
    "openai-codex==0.147.0",
    "openai-codex-cli-bin==0.147.0",
]
test = [
    "pytest>=8,<10",
]

[project.scripts]
spg = "spg.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "postgresql: requires the explicitly configured real PostgreSQL test database",
    "real_codex: requires explicit authorization for one real Codex SDK execution",
]

[tool.setuptools.packages.find]
where = ["src"]
